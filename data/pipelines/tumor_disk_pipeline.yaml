# Tumor, spinning-disk confocal (ST2): the disk-scope pass of a tumor_epi
# sample. Antibody (immuno) targets only, no combinatorial barcode.
# Loaded by MERci.acquisition.pipeline_config.load_pipeline_config.
# Per-experiment values (thresholds, boundaries, ...) are set in the
# notebooks, not here.

id: tumor_disk
label: "Tumor -- Spinning-disk confocal"
analysis_backend: merlin   # notebooks 05/07 use the MERlin variants

microscope: ST2            # no 750 nm channel
objective: "60X"

imaging:
  file_type: ".zarr"
  exposure_time: 0.15   # seconds; laser power comes from data/configs/power/, per microscope

  cells_round:          # round 1: DAPI (segmentation) + beads
    z_min: 1
    z_max: 25
    z_step: 0.25
    bead_seq: [488]
    color_seq: [405,488]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  bits_round:           # every antibody round
    z_min: 1
    z_max: 25
    z_step: 0.25
    bead_seq: [488]
    color_seq: [650, 560]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  focus_test_z: 3       # z (um above bead_z) of the focus-test sequence
  transit_n_blank: 2    # blank frames per transit FOV

fluidics:
  use_adaptors: true            # adaptor-based fluidics
  include_final_cleave: false   # no cleave after the last imaging round
  first_hyb_no_cleave: true     # first hyb after the cells round has no cleave

dataorganization:
  # Antibody panel, one CSV per version:
  #   v1 (e.g. BC555_sample_05): H01 yH2AX@650, CENPA@560
  #   v2 (e.g. BC553_sample_02): H01 CENPA@650, EMERIN@560; H02 yH2AX@650
  # Switch together with merlin.sequential_kind (immuno_v1 / immuno_v2).
  round_bit_color_csv: configs/round_bit_color_map/tumor_disk_v1.csv
  # Bits are NDB adaptor numbers (bit 865 -> NDB_865, data/ndb_adaptors.csv).
  readout_catalog: ndb

merlin:
  project: bc     # "bc" | "lt" | "mf"
  lib_name: C3    # same library as tumor_epi
  # Target name per bit (NDB number): C3v1_codebook_<sequential_kind>.csv.
  # immuno_v1 goes with tumor_disk_v1.csv, immuno_v2 with tumor_disk_v2.csv.
  sequential_kind: immuno_v1

  analysis:
    n_optimize_iterations: 10   # no decoding here; still read by the cluster-resource file

    # Full task menu (data/configs/merlin/analysis/tasks/), in the order the
    # analysis YAML writes them.
    tasks:
      # Registration between rounds
      fiducial_template:           true    # weak disk beads: subtract the camera pattern
      fiducial_correlation_warp:   true
      # Stitching
      register_fov_neighbors:      true
      global_align_least_squares:  true
      global_align_simple:         false
      # Registration QC (report only)
      registration_diagnostics:    true
      # Preprocessing
      deconvolution_preprocess:    true
      # Decoding (no barcode in this pipeline)
      optimize_iteration:          false
      decode:                      false
      generate_adaptive_threshold: false
      adaptive_filter_barcodes:    false
      export_barcodes:             false
      plot_performance:            false
      slurm_report:                false
      # Mosaic
      create_ffc:                  true
      generate_mosaic:             true
      combine_mosaic_tiles:        true
      # Segmentation
      cellpose_segment_3d:         false
      cellpose_segment_sam:        true
      clean_cell_boundaries:       true
      combine_cleaned_boundaries:  true
      refine_cell_databases:       true
      export_cell_metadata:        true
      # Barcode-to-cell assignment
      partition_barcodes:          false
      export_partitioned_barcodes: false
      # Sequential/antibody signal per cell
      smfish_signal:               true
      sum_signal:                  true
      export_sum_signals:          true

    # {task: {param: value}}, merged over the task's own YAML.
    overrides:
      # Weak disk beads can't stitch: stitch on the DAPI max projection.
      # The warp's reference_channel follows it.
      register_fov_neighbors:
        max_projection_data_channel: DAPI
      # Notebook 07 replaces this with every imaged target.
      smfish_signal:
        channel_names: ["CENPA"]
      # SumSignal measures every sequential channel, whatever this lists.
      sum_signal:
        channel_names: ["yH2AX"]
