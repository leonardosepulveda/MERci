# Lineage tracing, MERFISH pass (ST2): combinatorial barcode only, all 26
# bits in LT2v0_codebook.csv, no sequential bits. Loaded by
# MERci.acquisition.pipeline_config.load_pipeline_config. Per-experiment
# values (thresholds, boundaries, ...) are set in the notebooks, not here.

id: lineage_tracing_merfish
label: "Lineage Tracing -- MERFISH"
analysis_backend: merlin   # notebooks 05/07 use the MERlin variants

microscope: ST2            # no 750 nm channel
objective: "60X"

imaging:
  file_type: ".zarr"
  exposure_time: 0.15   # seconds; laser power comes from data/configs/power/, per microscope

  cells_round:          # round 1: DAPI (segmentation) + beads
    z_min: 0.5
    z_max: 70
    z_step: 0.5
    bead_seq: [488]
    color_seq: [405, 488]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  bits_round:           # every barcode round
    z_min: 0.5
    z_max: 70
    z_step: 0.5
    bead_seq: [488]
    color_seq: [650, 560]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  focus_test_z: 0.5     # z (um above bead_z) of the focus-test sequence
  transit_n_blank: 2    # blank frames per transit FOV

fluidics:
  use_adaptors: false          # direct readouts
  include_final_cleave: true   # cleave after the last imaging round
  first_hyb_no_cleave: false   # first hyb after the cells round is cleaved as usual

dataorganization:
  round_bit_color_csv: configs/round_bit_color_map/lineage_tracing_merfish.csv   # bits index data/readouts.csv

merlin:
  project: lt     # "bc" | "lt" | "mf"
  lib_name: LT2   # codebook (data/configs/merlin/codebooks/)

  analysis:
    n_optimize_iterations: 10

    # Full task menu (data/configs/merlin/analysis/tasks/), in the order the
    # analysis YAML writes them.
    tasks:
      # Registration between rounds
      fiducial_template:           false
      fiducial_correlation_warp:   true
      # Stitching
      register_fov_neighbors:      true
      global_align_least_squares:  true
      global_align_simple:         false
      # Registration QC (report only)
      registration_diagnostics:    true
      # Preprocessing
      deconvolution_preprocess:    true
      # Decoding
      optimize_iteration:          true
      decode:                      true
      generate_adaptive_threshold: true
      adaptive_filter_barcodes:    true
      export_barcodes:             true
      plot_performance:            true
      slurm_report:                true
      # Mosaic
      create_ffc:                  true
      generate_mosaic:             true
      combine_mosaic_tiles:        true
      # Segmentation (on the cells round's DAPI)
      cellpose_segment_3d:         false
      cellpose_segment_sam:        true
      clean_cell_boundaries:       true
      combine_cleaned_boundaries:  true
      refine_cell_databases:       true
      export_cell_metadata:        true
      # Barcode-to-cell assignment
      partition_barcodes:          true
      export_partitioned_barcodes: true
      # Sequential signal per cell (no sequential bits here)
      smfish_signal:               false
      sum_signal:                  false
      export_sum_signals:          false

    overrides: {}
