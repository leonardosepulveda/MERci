# Lineage tracing, lineage-barcode pass (ST2), decoded with fishtank; the
# sibling acquisition of lineage_tracing_merfish. Loaded by
# MERci.acquisition.pipeline_config.load_pipeline_config. Per-experiment
# values (thresholds, boundaries, color_usage round tags,
# FISHTANK_CLUSTER_DIR, ...) are set in the notebooks, not here.

id: lineage_tracing_lineage
label: "Lineage Tracing -- Lineage (fishtank)"
analysis_backend: fishtank   # after_imaging/create_submit_files/ uses create_fishtank_files

microscope: ST2
objective: "60X"

imaging:
  file_type: ".zarr"
  exposure_time: 0.15   # seconds; laser power comes from data/configs/power/, per microscope

  cells_round:          # round 1: DAPI (segmentation) + 560 + beads
    z_min: 0.5
    z_max: 50
    z_step: 0.5
    bead_seq: [488]
    color_seq: [405, 560]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  bits_round:           # every lineage-barcode round
    z_min: 0.5
    z_max: 50
    z_step: 0.5
    bead_seq: [488]
    color_seq: [650, 560]
    end_seq: [488]
    scan_mode: interleaved
    z_return_mode: progressive
    return_step: 5

  focus_test_z: 3       # z (um above bead_z) of the focus-test sequence
  transit_n_blank: 2    # blank frames per transit FOV

# Imaging recipe only; fishtank's color_usage round tags are entered in
# create_fishtank_files.
dataorganization:
  round_bit_color_csv: configs/round_bit_color_map/lineage_tracing_lineage.csv

fluidics:
  use_adaptors: true            # adaptor-based fluidics
  include_final_cleave: false   # no cleave after the last imaging round
  first_hyb_no_cleave: true     # first hyb after the cells round has no cleave

# fishtank: color_usage colors and decode targets (create_fishtank_files).
# lineage_lib_version selects data/configs/fishtank/reference/<version>/;
# `{lib_version}` in the file names below is replaced with it.
fishtank:
  lineage_lib_version: v2

  color_usage_colors: ["650", "560", "488", "405"]

  targets:
    - name: intBC
      method: expectation_maximization
      reference_file: "intBC_codebook_{lib_version}.csv"
      whitelist: "embryo_integration_whitelist.txt"
    - name: HEK3
      method: logistic_regression
      reference_file: "HEK3_weights_{lib_version}.csv"
    - name: EMX1
      method: logistic_regression
      reference_file: "EMX1_weights_{lib_version}.csv"
    - name: RNF2
      method: logistic_regression
      reference_file: "RNF2_weights_{lib_version}.csv"
