# Atomic MERlin analysis-task definition -- one task's own tunable defaults
# only. Structural cross-references (warp_task/preprocess_task/optimize_task/
# previous_iteration/global_align_task/segment_task/decode_task/filter_task/
# .../random_seed) are injected by build_merlin_analysis_parameters()
# (src/MERci/acquisition/merlin_config.py) based on which atoms are actually
# in the recipe -- never hardcode them here.
#
# Full parameter list, verified directly against merlin.analysis.segment.
# CellPoseSegmentSAM.__init__ (~/260715_LT059_merlin_update/MERlin/merlin/
# analysis/segment.py) -- every key below is a real parameter that class
# reads; values already tuned here (channel_1_name/do_3D/dump_segmented_
# images/downsample_factor/flow3D_smooth/min_size/expand_mask) are kept as
# previously set (some differ from MERlin's own default, noted below);
# every other key was missing and is added at MERlin's own real default.
#
# Parameters are grouped below by where they're consumed (worked out in
# MERlin's own prompt_history/2026_08_29_1400_compare_cellposesam_merlin_vs_
# fishtank_params.md; full per-parameter detail in this repo's
# cache/merlin_cellposesam_parameter_classification.md): passed directly to
# cellpose, vs. passed to other MERlin subfunctions (channel I/O,
# downsample/upsample, mask post-processing, caching). `diameter` and
# `anisotropy` are flagged separately -- both are declared with a default
# but never actually referenced in _run_analysis, so they're dead/no-op
# regardless of value in the current MERlin code.
task: CellPoseSegmentSAM
module: merlin.analysis.segment
parameters:
  # -- Passed directly to cellpose --
  use_gpu: true                  # MERlin default: true
  path_to_user_model: false      # MERlin default: false (use the built-in model, not a custom path)
  do_3D: true
  flow_threshold: 0.4            # MERlin default: 0.4
  cellprob_threshold: 0.0        # MERlin default: 0.0
  min_size: 100                  # MERlin default: 0 -- kept at the previously tuned value
  tile_norm_blocksize: 0         # MERlin default: 0
  flow3D_smooth: 1               # MERlin default: 0 -- kept at the previously tuned value; only used when do_3D: true
  stitch_threshold: 0.25         # MERlin default: 0.25; only used when do_3D: false (MERlin's own manual stitcher -- keep non-zero, see cache/ note)

  # -- Passed to other MERlin subfunctions (not cellpose) --
  channel_1_name: DAPI
  channel_2_name: null           # MERlin default: null (no second channel)
  downsample_factor: 4           # shrinks input images before segmentation, upsamples masks back after
  dump_segmented_images: false   # if true, also dumps the (resized) input channel image(s) for debugging
  expand_mask: 2                 # MERlin default: 0 -- kept at the previously tuned value; post-hoc mask dilation, applied after stitching
  use_old_segmentation: false    # MERlin default: false (always re-segment); if true, reloads a cached mask when one already exists

  # -- Declared but dead/no-op in current MERlin code (never reach cellpose) --
  diameter: null                 # MERlin default: null; not used by cellpose>=4.0's SAM model, not referenced in _run_analysis
  anisotropy: 1                  # MERlin default: 1; not referenced in either eval() call regardless of value
