# Atomic MERlin task -- see ./README.md for the shared convention (never hardcode structural cross-references here).
#
# format: "parquet" writes ExportBarcodes/barcodes.parquet (read with
# pandas.read_parquet); "csv" writes the old barcodes.csv instead.
task: ExportBarcodes
module: merlin.analysis.exportbarcodes
parameters:
  columns:
  - barcode_id
  - global_x
  - global_y
  - global_z
  - x
  - y
  - fov
  - cell_index
  exclude_blanks: false
  format: parquet
