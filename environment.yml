name: merci_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - numpy
    - pandas
    - matplotlib
    - shapely
    - pillow
    - scikit-image
    - scikit-learn
    - joblib
    - scipy
    - jupyterlab
    - ipykernel
    - ipympl
    - ipywidgets
    - zarr
    - tifffile
    - pyarrow
    - pyyaml
    - affine6p
    - imageio
    - imageio-ffmpeg
